[project]
name = "polyweather"
version = "0.1.0"
description = "Autonomous Polymarket daily high-temperature trading and reward-farming system"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    "rich>=13",
    "metar>=2.0.1",
    "astral>=3.2",
    "py-clob-client-v2>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
